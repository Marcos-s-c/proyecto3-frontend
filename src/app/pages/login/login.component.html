<div class="bootstrap-wrapper">
  <div class="container">
    <div class="container background">
      <div class="row mt20">
        <div class="">
          <mat-card>
            <app-button routerLink="/" routerLinkActive="active"
              >< Regresar</app-button
            >
            <h1 class="text-center" style="color: #f25287">Venus</h1>

            <div class="container text-center">
              <img src="../../../assets/login.png" width="100" height="100" />
            </div>

            <form (ngSubmit)="formSubmit()">
              <mat-form-field class="full-width" appearance="outline">
                <mat-label>Email</mat-label>
                <input
                  [(ngModel)]="loginData.email"
                  name="email"
                  required
                  matInput
                  placeholder="Digite su nombre de usuario"
                />
                <mat-hint>El correo de usuario debe ser válido</mat-hint>
              </mat-form-field>
              <mat-form-field class="full-width" appearance="outline">
                <mat-label>Contraseña</mat-label>
                <input
                  [(ngModel)]="loginData.password"
                  name="password"
                  required
                  type="password"
                  matInput
                  placeholder="Digite su contraseña"
                />
                <mat-hint>La contraseña debe ser válida</mat-hint>
              </mat-form-field>

              <br /><br />

              <div class="container text-center">
                <app-button type="submit">Iniciar sesión</app-button>
                <!-- <button type="reset" style = "margin-left: 20px;" mat-raised-button color="accent">Limpiar</button> -->
              </div>
            </form>
            <mat-dialog-actions class="text-center">
              <div style="margin-top: 10px; cursor: pointer">
                <a (click)="openDialog()">Recuperar contraseña</a>
              </div>
            </mat-dialog-actions>
          </mat-card>
        </div>
      </div>
    </div>
  </div>
</div>
