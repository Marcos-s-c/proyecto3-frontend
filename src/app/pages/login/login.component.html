<div class="bootstrap-wrapper">
  <div class="container background">
    <div class="row mt20">
      <div class="">
        <mat-card>
          <button
            mat-raised-button
            class="button-color custom-button"
            style="position: absolute;  margin-top: 4px"
            routerLink="/"
            routerLinkActive="active"
          >
            < Regresar
          </button>
          <h1 class="text-center">Venus</h1>
          <div class="container text-center">
            <img src="../../../assets/login.png" width="100" height="100" />
          </div>

          <form (ngSubmit)="formSubmit()">
            <mat-form-field class="full-width" appearance="outline">
              <mat-label>Email</mat-label>
              <input
                [(ngModel)]="loginData.email"
                name="email"
                required
                matInput
                placeholder="Digite su nombre de usuario"
              />
              <mat-hint>El correo de usuario debe ser valido</mat-hint>
            </mat-form-field>
            <mat-form-field class="full-width" appearance="outline">
              <mat-label>Contraseña</mat-label>
              <input
                [(ngModel)]="loginData.password"
                name="password"
                required
                type="password"
                matInput
                placeholder="Digite su contraseña"
              />
              <mat-hint>La contraseña debe ser valida</mat-hint>
            </mat-form-field>

            <br /><br />

            <div class="container text-center">
              <button type="submit" mat-raised-button class="button-color">
                Iniciar sesión
              </button>
              <!-- <button type="reset" style = "margin-left: 20px;" mat-raised-button color="accent">Limpiar</button> -->
            </div>
          </form>
        </mat-card>
      </div>
    </div>
  </div>
</div>
