<div class="bootstrap-wrapper">
  <div class="container">
    <div class="row" style="margin-top: 20px">
      <div class="container">
        <div class="left-section">
          <div class="image-container">
            <img src="../../../assets/icon.png" />
          </div>
        </div>
        <div>
          <button
            mat-raised-button
            class="button-color custom-button"
            style="position: absolute; margin-left: 20px; margin-top: 4px"
            routerLink="/"
            routerLinkActive="active"
          >
            < Regresar
          </button>
        </div>
        <div class="right-section">
          <div class="text-center" style="padding-top: 20px">
            <h1 style="font-weight: 400">Crea Tu Cuenta Personal</h1>
            <form (ngSubmit)="formSubmit()">
              <mat-form-field class="full-width" appearance="outline">
                <mat-label>Nombre</mat-label>
                <input
                  required
                  [(ngModel)]="user.name"
                  name="nombre"
                  matInput
                  placeholder="Digite su nombre"
                />
              </mat-form-field>

              <mat-form-field class="full-width" appearance="outline">
                <mat-label>Apellido</mat-label>
                <input
                  required
                  [(ngModel)]="user.surname"
                  name="apellido"
                  matInput
                  placeholder="Digite su apellido"
                />
              </mat-form-field>
              <mat-form-field class="full-width" appearance="outline">
                <mat-label>Email</mat-label>
                <input
                  required
                  [(ngModel)]="user.email"
                  name="email"
                  type="email"
                  matInput
                  placeholder="Digite su email"
                />
              </mat-form-field>
              <mat-form-field class="full-width" appearance="outline">
                <mat-label>Telefono</mat-label>
                <input
                  required
                  [(ngModel)]="user.phone"
                  name="telefono"
                  matInput
                  placeholder="Digite su telefono"
                />
              </mat-form-field>
              <mat-form-field class="full-width" appearance="outline">
                <mat-label>Contraseña</mat-label>
                <input
                  required
                  [(ngModel)]="user.password"
                  name="password"
                  type="password"
                  matInput
                  placeholder="Digite su contraseña"
                />
              </mat-form-field>

              <div class="container">
                <div class="vertical-center">
                  <button
                    mat-raised-button
                    class="full-width-button button-color"
                    style="width: 250px"
                  >
                    Registrarme
                  </button>
                </div>

                <!-- <button type="reset" style = "margin-left: 20px;" mat-raised-button color="accent">Limpiar</button> -->
              </div>
            </form>
          </div>
        </div>
      </div>

      <br /><br /><br />
    </div>
  </div>
</div>
